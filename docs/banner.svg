<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="VanityRig - Tor v3 vanity .onion generator matching a prefix, a suffix, or anywhere in the address" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17121C"/>
      <stop offset="55%" stop-color="#1C1524"/>
      <stop offset="100%" stop-color="#241A2E"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7D4698" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7D4698" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7D4698" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>

    <!-- onion layers -->
    <g fill="none" stroke="#7D4698" stroke-width="1.5">
      <circle cx="1180" cy="200" r="120" opacity="0.16"/>
      <circle cx="1180" cy="200" r="196" opacity="0.13"/>
      <circle cx="1180" cy="200" r="276" opacity="0.10"/>
      <circle cx="1180" cy="200" r="360" opacity="0.07"/>
      <circle cx="1180" cy="200" r="448" opacity="0.05"/>
    </g>

    <rect x="590" y="52" width="1.5" height="296" fill="url(#rule)"/>

    <!-- wordmark + copy -->
    <text x="64" y="170" font-family="DejaVu Sans Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="66" font-weight="700" letter-spacing="-1.5" fill="#F1ECF5">VanityRig</text>

    <g font-family="DejaVu Sans Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9B87AC">
      <text x="66" y="220">Tor v3 vanity .onion generator with a live</text>
      <text x="66" y="246">TUI dashboard, upfront cost/time estimates,</text>
      <text x="66" y="272">and prefix/suffix/anywhere matching.</text>
    </g>

    <!-- match modes -->
    <g font-family="DejaVu Sans Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

      <text x="678" y="130" font-size="12" text-anchor="end" fill="#A970C9">prefix</text>
      <text x="700" y="130" font-size="14" fill="#6B5C78" xml:space="preserve"><tspan fill="#68B030" font-weight="700" filter="url(#glow)">vanityrig</tspan>qm4zk7bwnfp5yhcdjur2seqxkvm7t2xbydgr6shzc3antwe<tspan fill="#4E4359">.onion</tspan></text>

      <text x="678" y="200" font-size="12" text-anchor="end" fill="#A970C9">suffix</text>
      <text x="700" y="200" font-size="14" fill="#6B5C78" xml:space="preserve">qm4zk7bwnfp5yhcdjur2seqxkvm7t2xbydgr6shzc3antwe<tspan fill="#68B030" font-weight="700" filter="url(#glow)">vanityrig</tspan><tspan fill="#4E4359">.onion</tspan></text>

      <text x="678" y="270" font-size="12" text-anchor="end" fill="#A970C9">anywhere</text>
      <text x="700" y="270" font-size="14" fill="#6B5C78" xml:space="preserve">qm4zk7bwnfp5yhcdjur2<tspan fill="#68B030" font-weight="700" filter="url(#glow)">vanityrig</tspan>seqxkvm7t2xbydgr6shzc3antwe<tspan fill="#4E4359">.onion</tspan></text>

      <text x="700" y="332" font-size="13" fill="#68B030">match found</text>
      <text x="810" y="332" font-size="13" fill="#6B5C78">19.05M keys/sec, resumable, key saved to disk</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="10" fill="none" stroke="#7D4698" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
